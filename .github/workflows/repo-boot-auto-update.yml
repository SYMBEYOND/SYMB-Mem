name: ReBoot Auto Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - REPO_BOOT.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reboot-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-repo-boot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Update and publish REPO_BOOT safely
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "===== ReBoot publish attempt ${attempt}/3 ====="

            git fetch origin main
            git checkout -B main origin/main

            python3 .reboot/reboot.py doctor

            if [ -d tests ]; then
              python3 -m unittest discover \
                -s tests \
                -p 'test_reboot_v1_contract.py' \
                -v
            else
              echo "Note: No tests directory found, skipping contract tests."
            fi

            python3 .reboot/reboot.py update
            python3 .reboot/reboot.py check

            if git diff --quiet -- REPO_BOOT.md; then
              echo "REPO_BOOT.md already current"
              exit 0
            fi

            git add REPO_BOOT.md
            git commit -m "docs: auto-update REPO_BOOT"

            if git push origin HEAD:main; then
              echo "ReBoot publish succeeded"
              exit 0
            fi

            echo "Remote main moved during publish; regenerating from current main."
          done

          echo "ERROR: ReBoot could not publish after 3 synchronized attempts."
          exit 1
